name: Build APK and AAB

# Builds a real release APK + App Bundle on GitHub's servers.
# No Flutter/Android SDK is needed on your own machine.
# Trigger: push to main, or Actions tab -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create placeholder .env
        # `.env` is git-ignored (it may hold Supabase keys), but it is
        # declared as a Flutter asset, so `flutter analyze` warns when
        # it is absent. An empty file is fine — the app works fully
        # without Supabase and AdminService falls back to --dart-define.
        run: touch .env

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # NOTE: in Flutter 3.50 `flutter analyze` treats infos and warnings
      # as fatal by default (--fatal-infos/--fatal-warnings default true).
      # The 40+ infos here are the framework's own deprecation of
      # `package:flutter/material.dart` in favour of the new standalone
      # material_ui package — a framework-wide migration, not bugs in
      # this app. Errors still fail the build; infos/warnings don't.
      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Decode upload keystore (Play Store signing)
        # Only needed for a signed AAB. Set these repository secrets first:
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        # If the secrets are absent, the AAB is built unsigned and the
        # step is skipped (the APK still builds).
        # NOTE: the secrets check lives inside the shell script, not in an
        # `if:` expression — GitHub rejects `secrets.*` in `if:` at
        # workflow-parse time for this repository.
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No keystore secret set; building unsigned."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-muezzin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-muezzin-aab
          path: build/app/outputs/bundle/release/app-release.aab
