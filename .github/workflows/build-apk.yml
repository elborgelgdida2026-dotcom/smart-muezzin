name: Build APK and AAB

# Builds a real release APK + App Bundle on GitHub's servers.
# No Flutter/Android SDK is needed on your own machine.
# Trigger: push to main, or Actions tab -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create placeholder .env
        # `.env` is git-ignored (it may hold Supabase keys), but it is
        # declared as a Flutter asset, so `flutter analyze` warns when
        # it is absent. An empty file is fine — the app works fully
        # without Supabase and AdminService falls back to --dart-define.
        run: touch .env

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy plugins for Gradle 9
        # Two abandoned/old plugins break under Gradle 9 (Flutter 3.50):
        #  * flutter_qiblah 3.2.0 still calls jcenter(), which Gradle 9
        #    removed — the build fails evaluating ':flutter_qiblah'.
        #    JCenter shut down years ago; mavenCentral() is the correct
        #    replacement.
        #  * home_widget (all versions) compiles Kotlin with JVM target
        #    1.8 but inlines bytecode built with JVM 11 (WorkManager),
        #    failing ':home_widget:compileReleaseKotlin'. Kotlin 2.x also
        #    requires the Java and Kotlin JVM targets to match, so the
        #    Java compat goes to 17 as well.
        #  * flutter_compass_v2 (and any other old plugin) hard-codes a
        #    low compileSdk (33), but its AndroidX dependencies require
        #    compiling against 34+ — failing
        #    ':flutter_compass_v2:checkReleaseAarMetadata' with 15
        #    issues. The app itself already compiles against 37.
        # The JVM-target and compileSdk fixes are applied to every
        # plugin, so any other plugin with the same mismatch is covered
        # too. All patches target the pub-cache copies (idempotent;
        # re-applied after every `flutter pub get`, including on a warm
        # cache).
        run: |
          for f in "$HOME"/.pub-cache/hosted/pub.dev/*/android/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/\bjcenter()/mavenCentral()/g' "$f"
            sed -i -E 's/compileSdkVersion\s*=?\s*[0-9]+/compileSdkVersion 37/g; s/compileSdk\s*=?\s*[0-9]+/compileSdk 37/g' "$f"
            # Plugins that follow Flutter's default compileSdk (36) hit
            # the same AAR check when a dependency needs 37
            # (:shared_preferences_android's ':jni' dep) — pin them to 37
            # as well, matching the app itself.
            sed -i 's/flutter\.compileSdkVersion/37/g' "$f"
            if grep -q "jvmTarget" "$f"; then
              sed -i 's/jvmTarget = ["'"'"']1\.8["'"'"']/jvmTarget = "17"/g' "$f"
              sed -i 's/jvmTarget = ["'"'"']11["'"'"']/jvmTarget = "17"/g' "$f"
              sed -i 's/JvmTarget\.JVM_11/JvmTarget.JVM_17/g' "$f"
              sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
              sed -i 's/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g' "$f"
            fi
          done
          echo "plugin patches applied"

      # NOTE: in Flutter 3.50 `flutter analyze` treats infos and warnings
      # as fatal by default (--fatal-infos/--fatal-warnings default true).
      # The 40+ infos here are the framework's own deprecation of
      # `package:flutter/material.dart` in favour of the new standalone
      # material_ui package — a framework-wide migration, not bugs in
      # this app. Errors still fail the build; infos/warnings don't.
      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Decode upload keystore (Play Store signing)
        # Only needed for a signed AAB. Set these repository secrets first:
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        # If the secrets are absent, the AAB is built unsigned and the
        # step is skipped (the APK still builds).
        # NOTE: the secrets check lives inside the shell script, not in an
        # `if:` expression — GitHub rejects `secrets.*` in `if:` at
        # workflow-parse time for this repository.
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No keystore secret set; building unsigned."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-muezzin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-muezzin-aab
          path: build/app/outputs/bundle/release/app-release.aab
