name: smart_muezzin
description: "المؤذن الذكي – Smart Muezzin: prayer times, Quran, Azkar, Qibla, Tasbih and Islamic services."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Prayer times (Egyptian General Authority of Surveying = default)
  adhan: ^2.0.1
  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  # Qibla compass
  flutter_qiblah: ^0.7.0
  # Network + dates
  http: ^1.2.2
  intl: ^0.19.0
  timezone: ^0.9.4
  # Hijri calendar
  hijri: ^3.0.0
  # Local storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  # Notifications (local reminders)
  flutter_local_notifications: ^18.0.1
  # State
  provider: ^6.1.2
  # Audio (recitation playback + radio streaming + page-turn sound)
  audioplayers: ^6.1.0
  # External links (maps directions)
  url_launcher: ^6.3.0
  # File paths for backup export
  path_provider: ^2.1.3
  # Printed Mushaf: SVG pages from AlFurqan API
  flutter_svg: ^2.0.10+1
  # Nearby mosques: OpenStreetMap map view
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Studio: share/export cards
  share_plus: ^10.0.3
  gal: ^2.3.0
  # Admin panel backend (Supabase Auth + Postgres + RLS)
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  # Home-screen widget: next prayer + countdown
  home_widget: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/smart-muezzin-logo.jpg
    - assets/data/azkar.json
    - assets/data/hadith.json
    - assets/audio/page_turn.wav
  fonts:
    # Cairo is distributed by Google Fonts only as a variable font
    # (Cairo[slnt,wght].ttf); the same file is declared twice with
    # different weights, which Flutter resolves to the matching
    # variable-font instance. See fonts/README.md for sources.
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf
          weight: 400
        - asset: fonts/Cairo-Variable.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
        - asset: fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/smart-muezzin-logo.jpg"
  min_sdk_android: 21
